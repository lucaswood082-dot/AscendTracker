<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Prefetch other pages to make navigation faster -->
<link rel="prefetch" href="dashboard.html">
<link rel="prefetch" href="view.html">
<link rel="prefetch" href="workout.html">
<link rel="prefetch" href="analytics.html">
<link rel="prefetch" href="settings.html">
<link rel="prefetch" href="planner.html">

  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <title>My Workouts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      color: #38bdf8;
      font-size: 1.2rem;
    }
    .back-btn {
      display: inline-block;
      margin: 0.5rem auto 1rem auto;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      color: #020617;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      text-align: center;
    }
    .back-btn:hover { opacity: 0.85; }
    .page { display: flex; flex-direction: column; padding-top: 1rem; max-height: calc(100vh - 60px); }
    .container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .card { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #workoutsList { flex: 1; margin-top: 0.5rem; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    details.exercise { background: #020617; border: 1px solid #1f2937; border-radius: 12px; padding: 0.75rem; margin-bottom: 0.75rem; }
    summary { cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .exercise-details { margin-top: 0.5rem; padding-left: 0.5rem; }
    .exercise-name { font-weight: 600; margin-top: 0.5rem; background: none; border: none; padding: 0; font-size: 0.9rem; }
    .set-item { margin-left: 10px; font-size: 0.9rem; display: flex; gap: 12px; }
    .set-item span { display: inline-block; min-width: 50px; }
    button.danger { width: auto; padding: 0.25rem 0.5rem; font-size: 0.8rem; margin-left: 0.5rem; }
    .summary-left { display: flex; align-items: center; gap: 6px; }
    .summary-arrow { transition: transform 0.3s ease; }
    details[open] .summary-arrow { transform: rotate(90deg); }
  </style>
</head>
<body>

<div class="top-nav">Ascend</div>

<div style="text-align:center;">
  <button class="back-btn" onclick="window.location.href='workout.html'">← Back to Create Workout</button>
</div>

<div class="page">
  <div class="container">
    <div class="card">
      <h2 style="color:#38bdf8;">My Workouts</h2>
      <div id="workoutsList"></div>

      <button type="button" class="secondary" onclick="location.href='workout.html'" style="margin-top:0.5rem; align-self:flex-start;">
        Create New Workout
      </button>
    </div>
  </div>
</div>

<script>
const workoutsList = document.getElementById("workoutsList");

function loadWorkouts() {
  const workouts = JSON.parse(localStorage.getItem("workouts")) || [];
  workoutsList.innerHTML = "";

  if (workouts.length === 0) {
    workoutsList.innerHTML = `<p style="text-align:center; color:#9ca3af;">No workouts saved yet.</p>`;
    return;
  }

  workouts.forEach((workout, index) => {
    const details = document.createElement("details");
    details.classList.add("exercise");

    const summary = document.createElement("summary");
    const leftDiv = document.createElement("div");
    leftDiv.classList.add("summary-left");

    const arrow = document.createElement("span");
    arrow.classList.add("summary-arrow");
    arrow.textContent = "▶";

    const title = document.createElement("span");
    title.textContent = `${workout.name} (${workout.date})`;

    leftDiv.appendChild(arrow);
    leftDiv.appendChild(title);

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";
    deleteBtn.classList.add("danger");
    deleteBtn.addEventListener("click", e => {
      e.stopPropagation();
      workouts.splice(index, 1);
      localStorage.setItem("workouts", JSON.stringify(workouts));
      loadWorkouts();
    });

    summary.appendChild(leftDiv);
    summary.appendChild(deleteBtn);
    details.appendChild(summary);

    const detailsDiv = document.createElement("div");
    detailsDiv.classList.add("exercise-details");

    workout.exercises.forEach(ex => {
      const exName = document.createElement("div");
      exName.textContent = `${ex.name}:`;
      exName.classList.add("exercise-name");
      detailsDiv.appendChild(exName);

      ex.sets.forEach(s => {
        const setDiv = document.createElement("div");
        setDiv.classList.add("set-item");
        if (ex.unilateral) {
          setDiv.innerHTML = `<span>Left: ${s.leftReps}</span> <span>Right: ${s.rightReps}</span> <span>Weight: ${s.weight}kg</span>`;
        } else {
          setDiv.innerHTML = `<span>Reps: ${s.reps}</span> <span>Weight: ${s.weight}kg</span>`;
        }
        detailsDiv.appendChild(setDiv);
      });
    });

    details.appendChild(detailsDiv);
    workoutsList.appendChild(details);
  });
}

// Load workouts on page load
loadWorkouts();
</script>

  <button data-page="settings" onclick="location.href='settings.html'" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af;">

      </svg>
    </span>
    <span class="label" style="font-size: 0.75rem; margin-top: 2px;">Settings</span>
  </button>
<script>
  // Highlight the active bottom nav button
  const currentPage = location.pathname.split("/").pop();

  document.querySelectorAll(".bottom-nav button").forEach(btn => {
    // btn.dataset.page should match the filename without .html
    if (btn.dataset.page + ".html" === currentPage) {
      btn.classList.add("active");
    }
  });
</script>

</nav>
