<!DOCTYPE html>

<body>

<div class="top-nav">Ascend</div>
<style>
  /* === TOP NAV (MATCHES ALL OTHER PAGES) === */
  .top-nav {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: #111827;
    border-bottom: 1px solid #1f2937;

    padding: 1rem;
    text-align: center;

    font-weight: 600;
    font-size: 1.2rem;
    color: #38bdf8;
  }
  /* ===============================
   REMOVE ALL CLICK HIGHLIGHTS
   (Chrome / Web / PWA)
=============================== */

/* Kill tap highlight */
* {
  -webkit-tap-highlight-color: transparent !important;
}

/* Kill ALL outlines */
*:focus,
*:focus-visible,
*:active {
  outline: none !important;
}

/* Kill box-shadows Chrome adds */
button,
a,
button:focus,
button:active,
button:focus-visible,
a:focus,
a:active,
a:focus-visible {
  box-shadow: none !important;
  outline: none !important;
}

/* Bottom nav specific hard reset */
.bottom-nav *,
nav *,
.bottom-nav a,
.bottom-nav button {
  outline: none !important;
  box-shadow: none !important;
  background-color: transparent !important;
}

/* Prevent focus from sticking after click */
button,
a {
  -webkit-user-select: none;
  user-select: none;
}


  /* ensure content doesn’t hide under nav */
  .page {
    padding-top: 1rem;
  }
</style>

<div class="page">
  <div class="container">
    <div class="card">

      <div id="deletedList"></div>

      <p id="emptyText" style="text-align:center; opacity:0.6; display:none;">
        No recently deleted workouts
      </p>

    </div>
  </div>
</div>

<script src="recently-deleted.js"></script>
</body>
