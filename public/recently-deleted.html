<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recently Deleted</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111827;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  .page {
    flex: 1;
  }
</style>

<body>

<div class="top-nav">Ascend</div>
<style>
  /* === TOP NAV (MATCHES ALL OTHER PAGES) === */
  .top-nav {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: #111827;
    border-bottom: 1px solid #1f2937;

    padding: 1rem;
    text-align: center;

    font-weight: 600;
    font-size: 1.2rem;
    color: #38bdf8;
  }

  /* ensure content doesn’t hide under nav */
  .page {
    padding-top: 1rem;
  }
</style>

<div class="page">
  <div class="container">
    <div class="card">

      <div id="deletedList"></div>

      <p id="emptyText" style="text-align:center; opacity:0.6; display:none;">
        No recently deleted workouts
      </p>

    </div>
  </div>
</div>

<script src="recently-deleted.js"></script>
</body>
</html>
