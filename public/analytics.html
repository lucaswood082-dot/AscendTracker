<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics</title>

  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="style.css">

  <style>
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      color: #38bdf8;
      font-size: 1.2rem;
    }

    .page { padding: 1rem; }
    .card {
      background: #1f2937;
      color: #e5e7eb;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 0.5rem;
    }

    .workout-item {
      background: #111827;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      border-radius: 0.5rem;
    }

    h2, h3 {
      color: #38bdf8;
    }

    ul { padding-left: 1rem; list-style: none; }
  </style>
</head>
<body>

  <div class="top-nav">Ascend</div>

  <div class="page">

    <!-- OVERALL STATS -->
    <div class="card">
      <h3>Overall Total Tonnage</h3>
      <p id="overallTonnage" style="font-size: 1.5rem; font-weight: 600;">0 kg</p>
    </div>

    <div class="card">
      <h3>Total Sets</h3>
      <p id="totalSets">0</p>
    </div>

    <div class="card">
      <h3>Total Reps</h3>
      <p id="totalReps">0</p>
    </div>

    <!-- PER WORKOUT ANALYTICS -->
    <div class="card">
      <h3>Workouts</h3>
      <ul id="analyticsList"></ul>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button data-page="dashboard" onclick="location.href='dashboard.html'">
      <span class="icon"><img src="/icons/home.png" class="nav-icon"></span>
      <span class="label">Home</span>
    </button>

    <button data-page="view" onclick="location.href='view.html'">
      <span class="icon"><img src="/icons/workout.png" class="nav-icon"></span>
      <span class="label">Workouts</span>
    </button>

    <button data-page="workout" class="create-btn" onclick="location.href='workout.html'">
      <span class="icon">＋</span>
    </button>

    <button data-page="analytics" disabled>
      <span class="icon"><img src="/icons/analytics.png" class="nav-icon"></span>
      <span class="label">Analytics</span>
    </button>

    <button data-page="profile" disabled>
      <span class="icon"><img src="/icons/profile.png" class="nav-icon"></span>
      <span class="label">Profile</span>
    </button>
  </nav>

  <script src="analytics.js"></script>

  <script>
    // Highlight current nav
    const currentPage = location.pathname.split("/").pop().replace(".html","");
    document.querySelectorAll(".bottom-nav button").forEach(btn => {
      if(btn.dataset.page === currentPage) btn.classList.add("active");
    });
  </script>

</body>
</html>
