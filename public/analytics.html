<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics</title>

  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="style.css">

  <style>
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      color: #38bdf8;
      font-size: 1.2rem;
    }

    .page {
      padding: 1rem;
    }

    .stat-card {
      background: #1f2937;
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 1rem;
      color: #e5e7eb;
    }

    .stat-card h3 {
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }

    /* SWIPE CONTAINER */
    .workout-carousel {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 1rem;
    }

    .workout-carousel::-webkit-scrollbar {
      display: none;
    }

    .workout-card {
      flex: 0 0 85%;
      scroll-snap-align: center;
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 1rem;
      color: #e5e7eb;
    }

    .workout-card h4 {
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }

    .workout-date {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-bottom: 0.75rem;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="top-nav">Ascend</div>

  <div class="page">

    <!-- OVERALL STATS -->
    <div class="stat-card">
      <h3>Total Tonnage</h3>
      <p id="overallTonnage" style="font-size:1.5rem;font-weight:600;">0 kg</p>
    </div>

    <div class="stat-card">
      <div class="metric">
        <span>Total Sets</span>
        <span id="totalSets">0</span>
      </div>
      <div class="metric">
        <span>Total Reps</span>
        <span id="totalReps">0</span>
      </div>
    </div>

    <!-- SWIPEABLE WORKOUTS -->
    <div class="workout-carousel" id="analyticsList"></div>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button data-page="dashboard" onclick="location.href='dashboard.html'">
      <span class="icon"><img src="/icons/home.png" class="nav-icon"></span>
      <span class="label">Home</span>
    </button>

    <button data-page="view" onclick="location.href='view.html'">
      <span class="icon"><img src="/icons/workout.png" class="nav-icon"></span>
      <span class="label">Workouts</span>
    </button>

    <button data-page="workout" class="create-btn" onclick="location.href='workout.html'">
      <span class="icon">＋</span>
    </button>

    <button data-page="analytics" disabled>
      <span class="icon"><img src="/icons/analytics.png" class="nav-icon"></span>
      <span class="label">Analytics</span>
    </button>

    <button data-page="profile" disabled>
      <span class="icon"><img src="/icons/profile.png" class="nav-icon"></span>
      <span class="label">Profile</span>
    </button>
  </nav>

  <script src="analytics.js"></script>

  <script>
    const current = location.pathname.split("/").pop().replace(".html","");
    document.querySelectorAll(".bottom-nav button").forEach(btn => {
      if (btn.dataset.page === current) btn.classList.add("active");
    });
  </script>

</body>
</html>
