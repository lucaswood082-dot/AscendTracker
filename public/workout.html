  <style>
    /* 🔒 FORCE SCROLL BACK ON (OVERRIDES style.css) */
    html, body {
      height: auto !important;
      min-height: 100% !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch !important;
    }

    /* Sticky Top Navigation */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      color: #38bdf8;
      font-size: 1.2rem;
    }

    .back-btn {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      color: #020617;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .back-btn:hover { opacity: 0.85; }

    /* MAIN PAGE FLOW — NO HEIGHT LIMITS */
    .page {
      padding: 1rem 0 2rem;
      height: auto !important;
      overflow: visible !important;
    }

    .container,
    .card,
    #exerciseList {
      height: auto !important;
      overflow: visible !important;
    }

    /* HIDE ANY STRAY ICONS INSIDE PAGE (except create button) */
    .page .icon:not(.create-btn .icon) {
      display: none !important;
    }
  </style>
</head>

  <script>
    const current = location.pathname.split("/").pop().replace(".html", "");

    document.querySelectorAll(".bottom-nav button").forEach(btn => {
      if (btn.dataset.page === current) {
        btn.classList.add("active");
      }
    });
  </script>
<script>
  function handleNav(target) {
    const current = location.pathname.split("/").pop();
    if (current === target) return; // already on page
    location.href = target;
  }
</script>
<script>
  document.querySelectorAll('.bottom-nav button:not([disabled])')
    .forEach(btn => {

      // instant tap feedback
      btn.addEventListener('touchstart', () => {
        btn.classList.add('tap-active');
        navigator.vibrate?.(12);
      });

      btn.addEventListener('touchend', () => {
        btn.classList.remove('tap-active');
      });

      btn.addEventListener('touchcancel', () => {
        btn.classList.remove('tap-active');
      });

      // desktop fallback
      btn.addEventListener('mousedown', () => {
        btn.classList.add('tap-active');
      });

      btn.addEventListener('mouseup', () => {
        btn.classList.remove('tap-active');
      });
    });
</script>
<!-- CLEAR WORKOUT CONFIRM MODAL -->
<div id="clearModal" class="modal hidden">
  <div class="modal-box">
    <h3>Clear workout?</h3>
    <p>This will remove all exercises and sets. This cannot be undone.</p>

    <div class="modal-actions">
      <button id="cancelClear" class="btn-secondary">Cancel</button>
      <button id="confirmClear" class="btn-danger">Clear</button>
    </div>
  </div>
</div>
<!-- Custom confirm popup -->
