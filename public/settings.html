<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings</title>

<style>
body.settings-page {
  background: #111827;
  color: #fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  padding: 1rem;
  min-height: 100vh;
}

.settings-container {
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-bottom: 120px;
}

h2 {
  color: #38bdf8;
  text-align: center;
  margin-bottom: 1rem;
}

.settings-header {
  font-size: 1.1rem;
  font-weight: 600;
  color: #38bdf8;
  margin-top: 1.5rem;
}

.setting-row {
  background: #1f2937;
  border-radius: 10px;
  padding: 0.75rem 1rem;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 500;
  color: #d1d5db;
  border: 1px solid transparent;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.2s;
}

.setting-row:hover {
  border-color: #38bdf8;
  background: #272f3b;
  color: #fff;
}

.arrow {
  color: #9ca3af;
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 10vh;
  z-index: 5000;
}

.modal {
  background: #1f2937;
  border-radius: 14px;
  width: 90%;
  max-width: 420px;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  opacity: 0;
  transform: translateY(20px);
  transition: 0.25s;
}

.modal.show {
  opacity: 1;
  transform: translateY(0);
}

.modal h3 {
  margin: 0;
  color: #38bdf8;
  font-size: 1.15rem;
}

.modal p {
  margin: 0;
  font-size: 0.9rem;
  color: #9ca3af;
}

/* ===== SHARED POPUP FORM (IDENTICAL INPUTS) ===== */
.popup-form {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.popup-form label {
  font-size: 0.85rem;
  color: #9ca3af;
}

.popup-form input {
  height: 44px;
  padding: 0 0.75rem;
  border-radius: 10px;
  border: 1px solid #374151;
  background: #111827;
  color: #fff;
  font-size: 0.95rem;
  font-family: inherit;
}

.popup-form input:focus {
  outline: none;
  border-color: #38bdf8;
}

/* ===== ACTION BUTTONS ===== */
.popup-actions {
  display: flex;
  gap: 0.75rem;
}

.popup-back-btn,
.popup-action-btn {
  flex: 1;
  padding: 0.6rem;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid transparent;
}

.popup-back-btn {
  background: #111827;
  color: #38bdf8;
  border-color: #38bdf8;
}

.popup-action-btn {
  background: #38bdf8;
  color: #020617;
}

/* ===== TOAST ===== */
#toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #38bdf8;
  color: #020617;
  padding: 0.5rem 1rem;
  border-radius: 12px;
  display: none;
  font-weight: 600;
  z-index: 6000;
  
}
</style>
</head>

<body class="settings-page">

<div class="settings-container">
  <h2>Settings</h2>

  <div class="settings-header">Account</div>
  <div class="setting-row" id="resetPasswordBtn">
    <span>Reset Password</span><span class="arrow">›</span>
  </div>
  <div class="setting-row" id="changeUsernameBtn">
    <span>Change Username</span><span class="arrow">›</span>
  </div>
  <div class="setting-row" id="deleteAccountBtn">
    <span>Delete Account</span><span class="arrow">›</span>
  </div>

  <div class="settings-header">Preferences</div>
  <div class="setting-row" id="themeBtn"><span>Theme</span><span class="arrow">›</span></div>
  <div class="setting-row" id="languageBtn"><span>Language</span><span class="arrow">›</span></div>
  <div class="setting-row" id="unitsBtn"><span>Units</span><span class="arrow">›</span></div>

  <div class="settings-header">App Info</div>
  <div class="setting-row" id="workoutHistoryBtn"><span>Workout History</span><span class="arrow">›</span></div>
  <div class="setting-row" id="exportWorkoutsBtn"><span>Export Workouts</span><span class="arrow">›</span></div>
  <div class="setting-row" id="termsBtn"><span>Terms</span><span class="arrow">›</span></div>
  <div class="setting-row" id="helpBtn"><span>Help</span><span class="arrow">›</span></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal"></div>
</div>

<div id="toast"></div>

<script src="settings.js"></script>
<script src="theme.js"></script>
<script src="settings.js"></script>
</body>

</body>
</html>
<script src="theme.js"></script>
