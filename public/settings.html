<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Make iOS Safari status bar dark -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Make Safari background match page -->
<meta name="theme-color" content="#0f172a">

<link rel="stylesheet" href="settings.css">
<body class="settings-page">


<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings</title>

<style>
body.settings-page {
  background: #111827;
  color: #fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  padding: 1rem;
  min-height: 100vh;
}

.settings-container {
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-bottom: 120px;
}

h2 {
  color: #38bdf8;
  text-align: center;
}

.settings-header {
  font-size: 1.1rem;
  font-weight: 600;
  color: #38bdf8;
  margin-top: 1.5rem;
}

.setting-row {
  background: #1f2937;
  border-radius: 10px;
  padding: 0.75rem 1rem;
  cursor: pointer;
  font-weight: 500;
  color: #d1d5db;
  border: 1px solid transparent;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.2s;
}

.setting-row:hover {
  border-color: #38bdf8;
  background: #272f3b;
  color: #fff;
}

.arrow {
  color: #9ca3af;
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 10vh;
  z-index: 5000;
}

.modal {
  background: #1f2937;
  border-radius: 14px;
  width: 90%;
  max-width: 420px;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  opacity: 0;
  transform: translateY(20px);
  transition: 0.25s;
}

.modal.show {
  opacity: 1;
  transform: translateY(0);
}

.modal h3 {
  margin: 0;
  color: #38bdf8;
}

.modal input {
  background: #111827;
  border: 1px solid #374151;
  border-radius: 10px;
  padding: 0.6rem;
  color: #fff;
}

.popup-actions {
  display: flex;
  gap: 0.75rem;
}

.popup-back-btn,
.popup-action-btn {
  flex: 1;
  padding: 0.6rem;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid transparent;
}

.popup-back-btn {
  background: #111827;
  color: #38bdf8;
  border-color: #38bdf8;
}

.popup-action-btn {
  background: #22c55e;
  color: #020617;
}

.danger {
  background: #ef4444;
  color: #020617;
}

.unit-btns {
  display: flex;
  gap: 0.75rem;
}

.unit-btns button {
  flex: 1;
  padding: 0.6rem;
  border-radius: 10px;
  border: 2px solid #374151;
  background: #111827;
  color: #fff;
  font-weight: 600;
}

.unit-btns button.active {
  border-color: #38bdf8;
  color: #38bdf8;
}

#toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #38bdf8;
  color: #020617;
  padding: 0.5rem 1rem;
  border-radius: 12px;
  display: none;
  font-weight: 600;
  z-index: 6000;
}
</style>
</head>

<body class="settings-page">

<div class="settings-container">
  <h2>Settings</h2>

  <div class="settings-header">Account</div>
  <div class="setting-row" id="resetPasswordBtn">Reset Password <span class="arrow">›</span></div>
  <div class="setting-row" id="changeUsernameBtn">Change Username <span class="arrow">›</span></div>
  <div class="setting-row" id="deleteAccountBtn">Delete Account <span class="arrow">›</span></div>

  <div class="settings-header">Preferences</div>
  <div class="setting-row" id="spotifyBtn">Spotify <span class="arrow">›</span></div>
  <div class="setting-row" id="unitsBtn">Units <span class="arrow">›</span></div>

  <div class="settings-header">App Info</div>
  <div class="setting-row" id="exportWorkoutsBtn">Export Workouts <span class="arrow">›</span></div>
</div>


</style>

<style>
  .export-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(255,255,255,0.04);
  margin-bottom: 10px;
}

/* hide native checkbox */
.export-row input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid #666;
  display: grid;
  place-content: center;
  cursor: pointer;
}

/* checked state */
.export-row input[type="checkbox"]:checked {
  background: #38bdf8;
  border-color: #38bdf8;
}

/* checkmark */
.export-row input[type="checkbox"]:checked::after {
  content: "✓";
  color: white;
  font-size: 14px;
  font-weight: bold;
  content: "";
width: 8px;
height: 4px;
border-left: 2px solid white;
border-bottom: 2px solid white;
transform: rotate(-45deg);
  
}
/* All buttons on settings page get a subtle press animation */
.settings-page button {
  transition: transform 0.08s ease; /* smooth shrink */
}

.settings-page button:active {
  transform: scale(0.95); /* shrink slightly on press */
}



/* CSS only, gives a “tap” feel */
.export-row input[type="checkbox"] {
  transition: transform 0.08s ease;
}

.export-row input[type="checkbox"]:active {
  transform: scale(0.9); /* shrink slightly on press */
}
/* Remove weird highlight on mobile when tapping buttons */
button {
  -webkit-tap-highlight-color: transparent; /* iOS & Android */
  -webkit-focus-ring-color: transparent;    /* Safari focus */
  outline: none;                             /* remove default outline */
}
/* Remove the default mobile tap highlight and focus outline */
button {
  -webkit-tap-highlight-color: transparent; /* iOS/Android tap highlight */
  outline: none;                             /* removes focus ring */
}

/* Optional: also remove the dotted outline that some browsers show on focus */
button:focus {
  outline: none;
  box-shadow: none;
}

</style>


<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<div id="toast"></div>

<script src="settings.js"></script>

</body>
</html>
