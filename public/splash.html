<!DOCTYPE html>
<html lang="en" style="background-color:#111827;"> <!-- inline bg fixes white flash -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ascend</title>

  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="style.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #111827 !important; /* fallback */
      font-family: sans-serif;
      color: #38bdf8;
      overflow: hidden;
    }

    #splash {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh; /* ensure full viewport */
      width: 100%;
      text-align: center;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .splash-logo {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #38bdf8;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 0.6s linear infinite; /* faster spin */
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="splash">
    <div class="splash-logo">Ascend</div>
    <div class="spinner"></div>
  </div>

  <script>
    setTimeout(() => {
      const splash = document.getElementById('splash');
      splash.classList.add('hidden');

      // wait for fade-out transition
      setTimeout(() => {
        window.location.href = "dashboard.html"; // index.html splash redirects to dashboard
      }, 300);
    }, 2000); // 2s splash duration
  </script>
</body>
</html>
