<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Status bar / browser UI colour -->
  <meta name="theme-color" content="#111827">

  <!-- iOS PWA status bar -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />

  <style>
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      color: #38bdf8;
      font-size: 1.2rem;
    }

    .page { padding-top: 1rem; }
    .back-btn, .logout-btn {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      color: #020617;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      margin-right: 5px;
    }
    .back-btn:hover, .logout-btn:hover { opacity: 0.85; }

    /* NEW: spacing between cards */
    .card + .card {
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="top-nav">Ascend</div>

<div style="text-align:center; margin-top: 8px;">
  <button id="logoutBtn">Logout</button>
</div>

<div class="page">
  <div class="container">

    <!-- WELCOME CARD -->
    <div class="card">
      <h2 id="dashboardTitle">Welcome!</h2>
    </div>

    <!-- PLANNER PREVIEW CARD -->
    <div class="card planner-card">
      <div class="planner-header">
        <h3>Planner</h3>
      </div>

      <div class="card" style="margin-top: 8px;">
        <h3>Today's Workout</h3>
        <p id="todayWorkout">Loading...</p>
      </div>

      <button class="planner-link" onclick="location.href='planner.html'" style="margin-top:8px;">
        Show more
      </button>
    </div>

  </div>
</div>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav" style="position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #111827; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1f2937; z-index: 1000;">
  
  <button data-page="dashboard" onclick="location.href='dashboard.html'" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af;">
    <span class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="24" height="24">
        <path d="M11.47 3.841a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.061l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 1 0 1.061 1.06l8.69-8.689Z" />
        <path d="m12 5.432 8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.432Z" />
      </svg>
    </span>
    <span class="label" style="font-size: 0.75rem; margin-top: 2px;">Home</span>
  </button>

  <button data-page="view" onclick="location.href='view.html'" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af;">
    <span class="icon">
      <!-- SVG for Workouts here -->
    <!-- Workouts -->
<button data-page="view" onclick="location.href='view.html'" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af;">
  <span class="icon">
    <!-- New Workouts SVG -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
      <path fill-rule="evenodd" d="M7.502 6h7.128A3.375 3.375 0 0 1 18 9.375v9.375a3 3 0 0 0 3-3V6.108c0-1.505-1.125-2.811-2.664-2.94a48.972 48.972 0 0 0-.673-.05A3 3 0 0 0 15 1.5h-1.5a3 3 0 0 0-2.663 1.618c-.225.015-.45.032-.673.05C8.662 3.295 7.554 4.542 7.502 6ZM13.5 3A1.5 1.5 0 0 0 12 4.5h4.5A1.5 1.5 0 0 0 15 3h-1.5Z" clip-rule="evenodd" />
      <path fill-rule="evenodd" d="M3 9.375C3 8.339 3.84 7.5 4.875 7.5h9.75c1.036 0 1.875.84 1.875 1.875v11.25c0 1.035-.84 1.875-1.875 1.875h-9.75A1.875 1.875 0 0 1 3 20.625V9.375Zm9.586 4.594a.75.75 0 0 0-1.172-.938l-2.476 3.096-.908-.907a.75.75 0 0 0-1.06 1.06l1.5 1.5a.75.75 0 0 0 1.116-.062l3-3.75Z" clip-rule="evenodd" />
    </svg>
  </span>
  <span class="label" style="font-size: 0.75rem; margin-top: 2px;">Workouts</span>
</button>


  <!-- Create Workout -->
<button data-page="workout" class="create-btn" onclick="location.href='workout.html'" 
        style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #38bdf8;">
  <span class="icon">
    <!-- New Create SVG -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
      <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 9a.75.75 0 0 0-1.5 0v2.25H9a.75.75 0 0 0 0 1.5h2.25V15a.75.75 0 0 0 1.5 0v-2.25H15a.75.75 0 0 0 0-1.5h-2.25V9Z" clip-rule="evenodd" />
    </svg>
  </span>
</button>


  <button data-page="analytics" onclick="location.href='analytics.html'" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af;">
    <span class="icon">
      <!-- SVG for Analytics here -->
  <!-- Analytics -->
<button data-page="analytics" onclick="location.href='analytics.html'" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af;">
  <span class="icon">
    <!-- New Analytics SVG -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
      <path fill-rule="evenodd" d="M3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6Zm4.5 7.5a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0v-2.25a.75.75 0 0 1 .75-.75Zm3.75-1.5a.75.75 0 0 0-1.5 0v4.5a.75.75 0 0 0 1.5 0V12Zm2.25-3a.75.75 0 0 1 .75.75v6.75a.75.75 0 0 1-1.5 0V9.75A.75.75 0 0 1 13.5 9Zm3.75-1.5a.75.75 0 0 0-1.5 0v9a.75.75 0 0 0 1.5 0v-9Z" clip-rule="evenodd" />
    </svg>
  </span>
  <span class="label" style="font-size: 0.75rem; margin-top: 2px;">Analytics</span>
</button>

      <!-- SVG for Profile here -->
    <!-- Profile -->
<button data-page="profile" disabled style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af;">
  <span class="icon">
    <!-- New Profile SVG -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
      <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" />
    </svg>
  </span>
  <span class="label" style="font-size: 0.75rem; margin-top: 2px;">Profile</span>
</button>



<script>
window.addEventListener("DOMContentLoaded", () => {
  // AUTH
  const currentUser = JSON.parse(localStorage.getItem("currentUser"));
  if (!currentUser) {
    setTimeout(() => window.location.href = "index.html", 50);
    return;
  }

  document.getElementById("dashboardTitle").textContent =
    `Welcome, ${currentUser.username}`;

  // LOGOUT
  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("currentUser");
    window.location.href = "index.html";
  });

  // ACTIVE NAV
  const current = location.pathname.split("/").pop().replace(".html", "");
  document.querySelectorAll(".bottom-nav button").forEach(btn => {
    if (btn.dataset.page === current) btn.classList.add("active");
  });

  // ===== FIXED PLANNER PREVIEW =====
  const users = JSON.parse(localStorage.getItem("users")) || [];
  const user = users[0];
  const planner = user?.planner || {};

  // LOCAL DATE (NO UTC BUG)
  const now = new Date();
  const todayKey =
    `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  const todayWorkoutEl = document.getElementById("todayWorkout");

  if (planner[todayKey]) {
    todayWorkoutEl.textContent =
      typeof planner[todayKey] === "string"
        ? planner[todayKey]
        : planner[todayKey].name;
  } else {
    todayWorkoutEl.textContent = "No workout planned for today";
  }
});
</script>
<script>
  document.querySelectorAll('.bottom-nav button:not([disabled])')
    .forEach(btn => {

      // instant tap feedback
      btn.addEventListener('touchstart', () => {
        btn.classList.add('tap-active');
        navigator.vibrate?.(12);
      });

      btn.addEventListener('touchend', () => {
        btn.classList.remove('tap-active');
      });

      btn.addEventListener('touchcancel', () => {
        btn.classList.remove('tap-active');
      });

      // desktop fallback
      btn.addEventListener('mousedown', () => {
        btn.classList.add('tap-active');
      });

      btn.addEventListener('mouseup', () => {
        btn.classList.remove('tap-active');
      });
    });
</script>

</body>
</html>
